# litearm_gazebo_controllers.yaml — Gazebo 物理仿真用的控制器配置。
#
# 与真机/干跑的 litearm_controllers.yaml 只有一处差别：
#   command_interfaces 用 [position]（而不是 position+velocity）。
# GazeboSystem 由位置指令通过物理引擎伺服；同时写 position 和 velocity
# 会让“位置/速度”两个执行器语义打架，位置模式更接近常规 Gazebo 用法。
#
# 控制链路、JTC action 名、关节顺序与真机完全一致，因此现有的探针
# （moveit_probe / replan_probe / safety_probe）无需修改即可复用。
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    command_interfaces: [position]
    state_interfaces: [position, velocity]

    constraints:
      stopped_velocity_tolerance: 0.03
      goal_time: 3.0
      joint1: {trajectory: 0.35, goal: 0.02}
      joint2: {trajectory: 0.35, goal: 0.02}
      joint3: {trajectory: 0.30, goal: 0.02}
      joint4: {trajectory: 0.30, goal: 0.02}
      joint5: {trajectory: 0.25, goal: 0.02}
      joint6: {trajectory: 0.25, goal: 0.02}
      joint7: {trajectory: 0.25, goal: 0.02}

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
