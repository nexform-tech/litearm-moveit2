# sensors_3d_wrist_only.yaml — start_fixed_camera:=false 时使用。
#
# 只保留腕装相机，避免 move_group 订阅不存在的
# /fixed_camera/depth/color/points 和 fixed_camera_* 帧。
sensors:
  - wrist_points

wrist_points:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/depth/color/points
  max_range: 3.0
  point_subsample: 2
  padding_offset: 0.01
  padding_scale: 1.0
  max_update_rate: 10.0
  filtered_cloud_topic: /camera/depth/color/points_filtered

octomap_frame: base_link
octomap_resolution: 0.02
