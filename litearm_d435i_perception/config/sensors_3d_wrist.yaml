# sensors_3d_wrist.yaml — 腕装 + 固定外置两台 D435i 融进同一张 Octomap。
#
# 数据流
# ======
#   固定外置 D435i  /fixed_camera/depth/color/points
#   腕装 D435i      /camera/depth/color/points
#        -> PointCloudOctomapUpdater × 2
#        -> Octomap (frame_id=base_link)
#        -> /monitored_planning_scene
#        -> OMPL / wrist_scan 运行时复检
#
# 两台相机互补
# ============
# 固定相机从工位外侧连续看整个工作台，解决腕装相机“只看到当前视角”的
# 盲区；腕装相机负责补固定相机被物体/机械臂挡住的背面和近场。两边都用
# ShapeMask 自滤波（move_group 注册的机器人碰撞体），不会把手臂写进地图。
#
# 命名空间
# ========
# 固定相机用 /fixed_camera/... 与 fixed_camera_* 帧，避免和腕装相机的
# /camera/...、camera_* 帧冲突。别和旧的 d435i_avoidance.launch.py 同时
# 跑（旧 launch 的固定相机占用 /camera/...）。
#
# 性能
# ====
# 两路 320x180 相机、updater-side subsample=3、Octomap 2 Hz / 0.02 m。
# 相机侧的分辨率/帧率在 SDF/xacro 里定（320x180 @5 Hz）。
#
# 为什么 Octomap 更新只有 2 Hz：ShapeMask 是 move_group 里最重的 CPU 项，
# 两台相机按 5 Hz 全速喂时 PlanningSceneMonitor 的 TF buffer 会落后数秒，
# 自滤波按点云时间戳查不到机器人形状（Missing transform）→ 整帧手臂点云
# 入图变成幽灵障碍。限到 2 Hz 给 TF 回调让出 CPU；扫描本身很慢，2 Hz 的
# 地图更新足够。
#
# 早期配置 424x240 @10 Hz 更糟：Gazebo Classic 的点云转换吞吐只有 ~1.8 Hz，
# 时间戳落后仿真时钟数秒。320x180@5 Hz 时点云/深度图/相机信息都能跟上。
#
# padding_offset 为什么是 0.03
# ===========================
# Gazebo 相机插件在渲染完成之后才给点云打时间戳（负载高时可能晚几十到
# 上百毫秒），而 ShapeMask 是按点云时间戳查 TF 摆机器人形状。arm 在扫描
# 中移动时，这两者会出现 1–3 cm 的位姿错位；padding 只有 0.01 m 时，手臂
# 表面点会从形状边缘漏进 Octomap，变成跟着手臂走的幽灵障碍（规划起始状态
# 碰撞、Plan and Execute 拒绝执行）。0.03 m 覆盖这个时间错位。
# 代价：离机器人表面 3 cm 以内的薄障碍会被自滤波一并滤掉——这类点本来也
# 已经在碰撞距离内，扫描阶段可以接受。台面在 z=-0.04、底座碰撞从 z=0
# 开始，0.03 m 膨胀仍留有 1 cm 间隙。
sensors:
  - wrist_points
  - fixed_points

wrist_points:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/depth/color/points
  max_range: 3.0
  point_subsample: 3
  padding_offset: 0.03
  padding_scale: 1.0
  max_update_rate: 2.0
  filtered_cloud_topic: /camera/depth/color/points_filtered

fixed_points:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /fixed_camera/depth/color/points
  max_range: 3.0
  point_subsample: 3
  padding_offset: 0.03
  padding_scale: 1.0
  max_update_rate: 2.0
  filtered_cloud_topic: /fixed_camera/depth/color/points_filtered

octomap_frame: base_link
octomap_resolution: 0.02
